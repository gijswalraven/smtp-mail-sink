services:
  mail-sink:
    build: ./src/MailSink
    environment:
      # Development is the only environment in which the sink will listen without TLS and without
      # credentials. Compose is the local convenience path; a deployment sets neither of these and
      # the sink then refuses to start until a certificate and a credential pair are configured.
      - DOTNET_ENVIRONMENT=Development
    ports:
      # Loopback only. In this mode the sink accepts any recipient from anyone, and Docker's
      # published ports bypass the host firewall, so binding 0.0.0.0 would hand the whole LAN an
      # open sink. To run the deployed posture locally, drop DOTNET_ENVIRONMENT, set
      # MailSink__Tls__KeyVaultCertificateUri and the credentials, and publish 587 and 465.
      - "127.0.0.1:1025:1025"
    volumes:
      - ./mail:/mail
    restart: unless-stopped
